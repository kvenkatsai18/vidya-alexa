<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study Buddy · Alexa+ simulator</title>
<meta name="description" content="Simulated Alexa+ smart display running the Study Buddy add-on over MCP." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e2531'/%3E%3Crect x='14' y='18' width='36' height='26' rx='3' fill='%23f6f1e4'/%3E%3Cpath d='M14 46l12-6 12 6' fill='none' stroke='%23f7e35a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@300..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <main class="stage-col">
    <div class="device" id="device" aria-label="Simulated smart display">
      <div class="camera" aria-hidden="true"></div>
      <div class="screen" id="screen">
        <header class="statusbar">
          <span id="clock" class="clock">--:--</span>
          <span class="status-right">
            <span id="learner" class="learner" hidden></span>
            <span id="addon" class="addon" hidden>
              <svg viewBox="0 0 64 64" width="18" height="18" aria-hidden="true"><rect x="10" y="16" width="44" height="30" rx="4" fill="currentColor"/><path d="M10 50l14-7 14 7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
              Study Buddy
            </span>
            <span id="date" class="date"></span>
          </span>
        </header>

        <section class="ambient" id="ambient">
          <p class="ambient-time" id="ambientTime">--:--</p>
          <p class="ambient-date" id="ambientDate"></p>
          <p class="ambient-hint" id="ambientHint">Try “Alexa, help me study”</p>
        </section>

        <section class="cardwrap" id="cardwrap" hidden></section>

        <div class="captions" id="captions">
          <p class="cap-user" id="capUser"></p>
          <p class="cap-assistant" id="capAssistant"></p>
        </div>

        <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <div class="sheet-inner">
            <h2 id="sheetTitle">Confirm</h2>
            <p id="sheetMsg"></p>
            <form id="sheetForm" class="sheet-form" hidden></form>
            <div class="sheet-actions">
              <button class="btn-confirm" id="sheetYes">Confirm</button>
              <button class="btn-cancel" id="sheetNo">Cancel</button>
            </div>
            <p class="sheet-hint" id="sheetHint">Or just say “yes” or “no”.</p>
          </div>
        </div>

        <div class="lightbar" id="lightbar" aria-hidden="true"></div>
      </div>
    </div>

    <form class="talkbar" id="talkbar" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="Hold to talk" title="Hold to talk (or hold the space bar)">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <input id="text" type="text" placeholder="Say or type something to Alexa" aria-label="Message" />
      <button type="button" class="share" id="share" title="Share notes from your phone (PDF, text or Markdown)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8.5 12.5 14 7a3 3 0 0 1 4.2 4.2l-7.1 7.1a5 5 0 0 1-7.1-7.1L10.5 4.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Share notes
      </button>
      <input type="file" id="file" accept=".pdf,.txt,.md,text/plain,text/markdown,application/pdf" hidden />
      <button type="submit" class="send">Send</button>
    </form>
    <div class="chips" id="chips" aria-label="Suggestions"></div>
    <p class="micnote" id="micnote" hidden>Voice input needs Chrome or Edge. You can still type.</p>
  </main>

  <aside class="dev" id="dev" aria-label="Developer panel">
    <div class="dev-head">
      <h2>Under the hood</h2>
      <button class="ghost" id="devToggle" aria-expanded="true" title="Hide panel (D)">Hide</button>
    </div>

    <dl class="facts" id="facts">
      <div><dt>MCP server</dt><dd id="fServer">Connecting…</dd></div>
      <div><dt>Protocol</dt><dd id="fProto">–</dd></div>
      <div><dt>Transport</dt><dd>Streamable HTTP</dd></div>
      <div><dt>Session</dt><dd id="fSession">–</dd></div>
      <div><dt>Agent</dt><dd id="fAgent">–</dd></div>
      <div><dt>Agent Skills</dt><dd id="fSkill">–</dd></div>
    </dl>

    <div class="timetravel">
      <h3>Demo clock</h3>
      <p class="sub" id="serverNow">–</p>
      <div class="tt-actions">
        <button class="ghost" data-advance="1">Skip ahead a day</button>
        <button class="ghost" data-advance="3">Skip 3 days</button>
        <button class="ghost danger" id="resetHome">Reset everything</button>
      </div>
    </div>

    <div class="voicebox">
      <h3>Voice</h3>
      <div class="voice-row">
        <select id="voiceSelect" aria-label="Voice"></select>
        <button class="ghost" id="voiceTest" type="button">Test</button>
      </div>
      <p class="sub" id="voiceNote"></p>
      <div class="voice-row">
        <label class="toggle"><input type="checkbox" id="speakToggle" checked /> Speak replies</label>
        <label class="toggle" title="After a question, keep listening for your answer, like a real conversation"><input type="checkbox" id="handsFree" checked /> Hands-free conversation</label>
      </div>
    </div>

    <div class="traffic-head">
      <h3>MCP traffic</h3>
    </div>
    <ol class="traffic" id="traffic" aria-live="off"></ol>
  </aside>
  <button class="devopen" id="devOpen" hidden>Show developer panel</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
