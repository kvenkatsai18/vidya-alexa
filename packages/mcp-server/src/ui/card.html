<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vidya card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,400..600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap" rel="stylesheet" />
<style>
  /* Alexa+ cards: the bright Echo Show look by day; Alexa night (navy + cyan) when the host says "dark". */
  :root {
    --desk: #eef2f6;
    --surface: #ffffff;
    --surface-2: #e5ebf2;
    --line: #d3dce7;
    --ink: #0b1220;
    --ink-2: #44526a;
    --ink-3: #6b788d;
    --hi: #0077b6;        /* the Alexa light, dark enough to read on white */
    --hi-deep: #005f92;
    --hi-ink: #ffffff;
    --hi-text: #0067a0;
    --mark: #c4efff;      /* highlight behind key words */
    --warn: #9a6400;      /* getting there */
    --good: #0e8a5f;      /* mastered, correct */
    --oops: #c8452f;      /* mistakes */
    --new: #2a5bd7;
    --paper: #ffffff;
    --paper-ink: #0b1220;
    --night: #12163a;
    --night-2: #1c2150;
    --lamp: #ffc978;
    --r-lg: 18px;
    --r-md: 14px;
    --r-sm: 10px;
    --lift: 0 1px 0 rgba(11,18,32,.03), 0 10px 22px -18px rgba(11,18,32,.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --desk: #0b1220;
    --surface: #141e30;
    --surface-2: #1c2940;
    --line: #26344d;
    --ink: #ffffff;
    --ink-2: #b7c3d4;
    --ink-3: #7d8aa0;
    --hi: #1ad2ff;
    --hi-deep: #12b8e0;
    --hi-ink: #04121c;
    --hi-text: #5fe1ff;
    --mark: rgba(26,210,255,.26);
    --warn: #ffc24b;
    --good: #3ddc97;
    --oops: #ff7a6b;
    --new: #8eb4ff;
    --paper: #141e30;
    --paper-ink: #ffffff;
    --lift: 0 12px 26px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(12px, 1.05vw + 6px, 19px); background: transparent; }
  body {
    margin: 0;
    font-family: "Figtree", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--desk);
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  .card { padding: 1.4rem 1.6rem 1.6rem; }
  h1 { font-size: 1.9rem; font-weight: 750; letter-spacing: -0.012em; line-height: 1.12; text-wrap: balance; }
  h2 { font-size: 1.05rem; font-weight: 700; }
  .sub { color: var(--ink-2); font-size: 0.95rem; }
  .muted { color: var(--ink-3); }
  .stack > * + * { margin-top: 1rem; }
  .row { display: flex; gap: 1rem; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .big-num { font-size: 4.6rem; font-weight: 800; line-height: 0.9; letter-spacing: -0.03em; font-feature-settings: "tnum"; }

  /* key words get a soft Alexa-cyan highlight */
  mark, .hl { color: inherit; background: var(--mark); padding: 0 0.18em; border-radius: 0.25em; }
  mark.good { background: color-mix(in srgb, var(--good) 22%, transparent); }
  mark.oops { background: color-mix(in srgb, var(--oops) 20%, transparent); }

  /* fact card (flashcards, key points): a clean panel with the accent edge */
  .index {
    position: relative;
    background: var(--paper);
    color: var(--paper-ink);
    border: 1px solid var(--line);
    border-left: 4px solid var(--hi);
    border-radius: var(--r-md);
    padding: 1rem 1.2rem 1.1rem;
    line-height: 1.55;
    box-shadow: var(--lift);
  }
  .index > div + div { margin-top: 0.45rem; padding-top: 0.45rem; border-top: 1px solid var(--line); }
  .index .label { font-size: 0.78rem; font-weight: 700; color: var(--hi-text); display: block; margin-bottom: 0.4rem; }
  .index mark { color: inherit; }

  /* actions */
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.3rem; }
  button {
    font: inherit; font-size: 0.95rem; font-weight: 700;
    border-radius: 999px; padding: 0.68rem 1.25rem;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
  }
  button:hover { background: var(--surface-2); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 3px solid var(--new); outline-offset: 2px; }
  button.primary { background: var(--hi); border-color: var(--hi-deep); color: var(--hi-ink); }
  button.primary:hover { background: var(--hi-deep); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.small { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

  .chip { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.76rem; font-weight: 700; padding: 0.22rem 0.65rem; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .chip.solid { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .chip.learning { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .chip.shaky { background: color-mix(in srgb, var(--oops) 13%, transparent); color: var(--oops); }
  .chip.new { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.2rem; box-shadow: var(--lift); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0.85rem; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem 1.15rem; display: flex; flex-direction: column; gap: 0.35rem; }

  /* a note about your learning ("Last time: ..."), set apart with a coral edge */
  .note { font-size: 0.98rem; font-weight: 600; line-height: 1.35; color: var(--ink); padding: 0.45rem 0 0.45rem 0.8rem; border-left: 3px solid var(--oops); }
  .note.hi { border-color: var(--hi); }
  .note.event { color: var(--ink-2); border-color: var(--line); font-weight: 500; }

  /* quiz */
  .dots { display: flex; gap: 0.35rem; }
  .dots i { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
  .dots i.correct { background: var(--good); box-shadow: none; }
  .dots i.partial { background: var(--warn); box-shadow: none; }
  .dots i.incorrect { background: var(--oops); box-shadow: none; }
  .dots i.now { box-shadow: inset 0 0 0 2.5px var(--ink); }
  .fb { display: flex; gap: 0.8rem; align-items: flex-start; border-radius: var(--r-sm); padding: 0.75rem 0.95rem; margin-bottom: 1.1rem; font-size: 0.95rem; }
  .fb.correct { background: color-mix(in srgb, var(--good) 12%, transparent); }
  .fb.partial { background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .fb.incorrect { background: color-mix(in srgb, var(--oops) 11%, transparent); }
  .fb b { font-weight: 800; }
  .fb .tag { font-size: 0.78rem; color: var(--ink-2); display: block; margin-top: 0.2rem; }
  .q { font-size: 1.65rem; font-weight: 700; line-height: 1.25; text-wrap: pretty; margin: 0.9rem 0 1.1rem; max-width: 36ch; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .opt { display: flex; gap: 0.8rem; align-items: center; text-align: left; border-radius: var(--r-md); padding: 0.85rem 1rem; font-size: 1.05rem; font-weight: 650; background: var(--surface); box-shadow: var(--lift); }
  .opt:hover { border-color: var(--hi-deep); background: var(--surface); }
  .opt span { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 0.85rem; font-weight: 800; }
  .opt:hover span { background: var(--hi); color: var(--hi-ink); }
  .opt:hover { border-color: var(--hi); }

  /* flashcard flip */
  .flip { perspective: 1200px; }
  .flip-inner { position: relative; display: grid; transition: transform 500ms cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .flip .face { grid-area: 1 / 1; backface-visibility: hidden; min-height: 9rem; }
  .flip .back { transform: rotateY(180deg); }
  .flip .face p { font-size: 1.35rem; font-weight: 650; line-height: 1.6rem; padding-top: 0.2rem; }

  /* explanation */
  .say { font-size: 1.28rem; line-height: 1.45; font-weight: 500; text-wrap: pretty; max-width: 40ch; }
  .kp { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .kp li { display: grid; grid-template-columns: 1.1rem 1fr; gap: 0.6rem; font-size: 0.95rem; color: var(--ink); }
  .kp li::before { content: ""; width: 0.55rem; height: 0.55rem; margin-top: 0.45rem; border-radius: 50%; background: var(--hi); }
  .kp li.covered::before { background: var(--good); border-radius: 50%; }
  .kp li.missing::before { background: transparent; box-shadow: inset 0 0 0 2px var(--oops); border-radius: 50%; }
  .kp li.missing { color: var(--ink-2); }
  .kp li.pending::before { background: var(--line); }
  .two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.4rem; align-items: start; }

  /* mastery map */
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: 0.55rem; }
  .cell { border-radius: var(--r-sm); padding: 0.7rem 0.8rem; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; }
  .meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 999px; background: var(--ink-3); }
  .cell.solid .meter i { background: var(--good); }
  .cell.learning .meter i { background: var(--warn); }
  .cell.shaky .meter i { background: var(--oops); }
  .days { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; counter-reset: d; }
  .days li { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 0.8rem; align-items: baseline; padding: 0.6rem 0; border-bottom: 1.5px dashed var(--line); }
  .days li:last-child { border-bottom: 0; }
  .days li.today .when { color: var(--hi-text); font-weight: 800; }

  /* focus timer */
  .timer { font-size: 7.5rem; font-weight: 300; letter-spacing: -0.04em; line-height: 0.9; font-feature-settings: "tnum"; }
  .ring { width: 100%; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 1.2rem; }
  .ring i { display: block; height: 100%; background: var(--hi); transition: width 1s linear; }

  /* story mode: always night, it's bedtime */
  body.story { background: var(--night); color: #f4ecdd; }
  .storybook { padding: 1.6rem 1.9rem 1.7rem; background:
      radial-gradient(60rem 30rem at 85% -10%, rgba(255,201,120,.16), transparent 60%),
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(1.5px 1.5px at 28% 8%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 64% 14%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(2px 2px at 78% 26%, rgba(255,255,255,.55), transparent 60%),
      var(--night); }
  .storybook h1 { font-family: "Literata", Georgia, serif; font-weight: 600; font-size: 2.1rem; color: var(--lamp); letter-spacing: 0; }
  .storybook .for { color: #b9b6d6; font-size: 0.9rem; margin-top: 0.3rem; }
  .page { font-family: "Literata", Georgia, serif; font-size: 1.4rem; line-height: 1.6; max-width: 38ch; margin-top: 1.2rem; min-height: 8.5em; text-wrap: pretty; }
  .page::first-letter { font-size: 2.2em; float: left; line-height: 0.9; padding: 0.06em 0.12em 0 0; color: var(--lamp); }
  .pager { display: flex; gap: 0.5rem; align-items: center; margin-top: 1.2rem; }
  .pager i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #3a4078; }
  .pager i.on { background: var(--lamp); }
  .storybook button { background: #262c66; border-color: #3a4078; color: #f4ecdd; }
  .storybook button.primary { background: var(--lamp); border-color: var(--lamp); color: #2a1d06; }
  .voice-badge { display: inline-block; margin: .5rem 0 .2rem; padding: .2rem .7rem; border-radius: 999px; background: rgba(255,201,120,.16); color: var(--lamp); font-size: .8rem; font-weight: 700; font-family: "Figtree", sans-serif; }
  .msg { font-family: "Literata", Georgia, serif; font-size: 1.35rem; line-height: 1.55; margin: .8rem 0; }
  .steps { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .6rem; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: .6rem; align-items: center; }
  .steps li::before { content: counter(s); width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255,201,120,.16); color: var(--lamp); font-weight: 800; font-size: .85rem; }

  /* parent view: a concern always sits first, on its own card */
  .alert { border-radius: var(--r-md); padding: .85rem 1rem; background: var(--surface); border: 1px solid color-mix(in srgb, var(--oops) 35%, var(--line)); border-left: 6px solid var(--oops); display: grid; gap: .25rem; box-shadow: var(--lift); }
  .alert.watch { border-color: var(--line); border-left-color: var(--hi-deep); }
  .alert .quote { font-style: italic; color: var(--ink-2); }
  .days li.flag { background: color-mix(in srgb, var(--oops) 8%, transparent); border-radius: 8px; padding-left: .5rem; }

  /* Study Together */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .6rem; }
  .player { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: .6rem .8rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem .6rem; }
  .player.now { border-color: var(--hi); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hi) 30%, transparent); }
  .gamecode { display: inline-block; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800; letter-spacing: .06em; margin: .2rem 0 .6rem; color: var(--hi-text); }
  :root[data-theme="dark"] .gamecode { color: var(--hi); text-shadow: 0 0 22px rgba(26,210,255,.45); }
  .homechip { font-size: .75rem; color: var(--ink-2); width: 100%; }
  .pname { font-weight: 700; flex: 1; }
  .pscore { font-size: 1.6rem; font-weight: 800; font-feature-settings: "tnum"; }
  .moon { position: absolute; right: 1.6rem; top: 1.4rem; width: 3.2rem; height: 3.2rem; border-radius: 50%; box-shadow: inset -0.9rem -0.4rem 0 0 var(--lamp); transform: rotate(-20deg); opacity: .9; }

  /* swipeable carousel: snap scrolling, arrows, dots, keyboard */
  .carousel { position: relative; margin-top: 1rem; }
  .track { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 26rem); gap: 0.9rem; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 0.2rem; padding: 0.3rem 0.2rem 1rem; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .track:focus-visible { outline: 3px solid var(--new); outline-offset: 2px; border-radius: var(--r-md); }
  .slide { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem 1.15rem 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: var(--lift); min-height: 11rem; }
  .slide.index { border: 0; }
  .slide h2 { font-size: 1.15rem; }
  .slide .ex { margin-top: auto; padding-top: 0.6rem; border-top: 1.5px dashed var(--line); font-size: 0.92rem; color: var(--ink-2); }
  .slide .ex b { color: var(--hi-text); }
  .slide { border-top: 3px solid var(--hi); }
  .slide .actions { margin-top: auto; padding-top: 0.6rem; }
  .car-nav { display: flex; align-items: center; gap: 0.7rem; }
  .car-nav .pos { display: flex; gap: 0.35rem; }
  .car-nav .pos i { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--line); transition: background 160ms, transform 160ms; }
  .car-nav .pos i.on { background: var(--ink); transform: scale(1.2); }
  .car-nav button { width: 2.4rem; height: 2.4rem; padding: 0; display: grid; place-items: center; font-size: 1.1rem; }
  .sources { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; font-size: 0.85rem; color: var(--ink-2); }
  .sources button { padding: 0.25rem 0.7rem; font-size: 0.8rem; font-weight: 600; }

  .loading { padding: 2.5rem 1.6rem; color: var(--ink-3); display: flex; gap: 0.8rem; align-items: center; }
  .loading i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--hi); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }
  .enter { animation: enter 260ms cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .enter, .loading i { animation: none; } .flip-inner, button { transition: none; } }
  @media (max-width: 560px) {
    .two, .opts { grid-template-columns: 1fr; }
    .big-num { font-size: 3.4rem; }
    .timer { font-size: 5rem; }
    .days li { grid-template-columns: 1fr; gap: 0.2rem; }
  }
</style>
</head>
<body>
<main id="root"><div class="loading"><i></i>Getting that ready</div></main>
<script>
(() => {
  // ---------------------------------------------------------------- MCP Apps bridge (view side)
  const PROTOCOL = "2026-01-26";
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) =>
    new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      post({ id, method, params });
    });
  const notify = (method, params) => post({ method, params });

  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const p = pending.get(m.id);
      pending.delete(m.id);
      m.error ? p.reject(m.error) : p.resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-input": showLoading(); break;
      case "ui/notifications/tool-result": render(m.params?.structuredContent ?? parseText(m.params)); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      case "ui/resource-teardown": stopTimers(); post({ id: m.id, result: {} }); break;
    }
  });

  function parseText(result) {
    try { return JSON.parse(result?.content?.find((c) => c.type === "text")?.text ?? "{}"); } catch { return {}; }
  }
  function applyContext(ctx) {
    if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme;
  }
  const say = (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] }).catch(() => {});

  // Report content height (not the viewport) so the host can size the iframe to fit.
  let lastH = 0;
  new ResizeObserver(() => {
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h && h !== lastH) {
      lastH = h;
      notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: h });
    }
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "study-buddy-card", version: "0.2.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: PROTOCOL,
  }).then((res) => {
    applyContext(res?.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => {});

  // ---------------------------------------------------------------- helpers
  const root = document.getElementById("root");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : "");
  const btn = (label, utterance, cls = "") => `<button class="${cls}" data-say="${esc(utterance)}">${esc(label)}</button>`;
  const STATUS = { solid: "Solid", learning: "Getting there", shaky: "Shaky", new: "Not started" };
  const chip = (status) => `<span class="chip ${status}">${STATUS[status] ?? status}</span>`;
  const fmtDate = (iso) => new Date(iso.length === 10 ? iso + "T12:00:00Z" : iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  /** Highlighter-mark the given terms inside already-escaped text. */
  function highlight(text, terms, cls = "") {
    let out = esc(text);
    const uniq = [...new Set((terms || []).filter((t) => t && t.length > 2))].sort((a, b) => b.length - a.length).slice(0, 3);
    for (const t of uniq) {
      const re = new RegExp(`\\b(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})\\b`, "i");
      out = out.replace(re, `<mark class="${cls}">$1</mark>`);
    }
    return out;
  }
  const termsOf = (title) => [title, ...String(title).split(/\s+(?:and|versus|vs|of|the)\s+/i)];

  root.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-say]");
    if (b) {
      root.querySelectorAll("button[data-say]").forEach((x) => (x.disabled = true));
      b.classList.add("primary");
      say(b.dataset.say);
      return;
    }
    const link = e.target.closest("button[data-link]");
    if (link) {
      request("ui/open-link", { url: link.dataset.link }).catch(() => window.open(link.dataset.link, "_blank", "noopener"));
      return;
    }
    const f = e.target.closest("[data-flip]");
    if (f) f.classList.toggle("flipped");
    const pg = e.target.closest("button[data-page]");
    if (pg) turnPage(Number(pg.dataset.page));
  });

  function showLoading() {
    root.innerHTML = `<div class="loading"><i></i>Thinking</div>`;
  }

  let timers = [];
  function stopTimers() { timers.forEach(clearInterval); timers = []; }

  /** What the daily routine did on its own, as swipeable cards; today's plan comes last. */
  const DID = { school: "Synced school", study_set: "Made a study set", research: "Researched beyond your notes", plan: "Today's plan" };
  function briefingSlides(b) {
    return carousel(b.did.map((x) => ({ html: `<span class="sub" style="font-size:.8rem">${DID[x.kind] ?? ""}</span><p style="font-size:1.05rem;font-weight:650">${esc(x.text.replace(/^Planned today: /, ""))}</p>` })), "Since yesterday");
  }

  /** A swipeable row of slides. Works by touch swipe, the arrows, the dots, or the arrow keys. */
  function carousel(slides, label) {
    if (!slides.length) return "";
    return `<div class="carousel" data-carousel>
      <div class="track" tabindex="0" role="group" aria-roledescription="carousel" aria-label="${esc(label)}">${slides.map((x, i) => `<div class="${x.cls ?? "slide"}" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}">${x.html}</div>`).join("")}</div>
      ${slides.length > 1 ? `<div class="car-nav"><button type="button" data-car="prev" aria-label="Previous">‹</button><div class="pos">${slides.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div><button type="button" data-car="next" aria-label="Next">›</button><span class="sub">Swipe for more</span></div>` : ""}
    </div>`;
  }
  function initCarousels() {
    root.querySelectorAll("[data-carousel]").forEach((c) => {
      const track = c.querySelector(".track");
      const dots = [...c.querySelectorAll(".pos i")];
      const slides = [...track.children];
      const step = () => slides[1] ? slides[1].offsetLeft - slides[0].offsetLeft : track.clientWidth;
      const go = (dir) => track.scrollBy({ left: dir * step(), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      c.querySelector('[data-car="prev"]')?.addEventListener("click", () => go(-1));
      c.querySelector('[data-car="next"]')?.addEventListener("click", () => go(1));
      track.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { e.preventDefault(); go(1); } if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } });
      track.addEventListener("scroll", () => {
        // The nearest slide to the left edge; at the very end, the last slide (it can't reach the edge).
        const atEnd = track.scrollLeft >= track.scrollWidth - track.clientWidth - 4;
        let i = 0;
        slides.forEach((sl, j) => { if (Math.abs(sl.offsetLeft - slides[0].offsetLeft - track.scrollLeft) < Math.abs(slides[i].offsetLeft - slides[0].offsetLeft - track.scrollLeft)) i = j; });
        if (atEnd) i = slides.length - 1;
        dots.forEach((d, j) => d.classList.toggle("on", j === i));
      }, { passive: true });
    });
  }

  /** Lessons are notes to the assistant ("Call them Pri"); on the learner's screen they read to them ("Call you Pri"). */
  const toYou = (t) => String(t ?? "").replace(/^Call them\b/, "Call you");

  /** Lessons the learner taught us by correcting us: the assistant getting better day by day. */
  function learnedList(lessons) {
    if (!lessons || !lessons.length) return "";
    return `<div class="panel"><h2 style="margin-bottom:.5rem">What I've learned about helping you</h2><ul class="kp">${lessons
      .map((x) => `<li class="covered"><span>${esc(toYou(x.text))} <span class="muted">(${esc(x.when)}${x.source === "detected" ? ", from what you said" : ""})</span></span></li>`)
      .join("")}</ul></div>`;
  }

  // ---------------------------------------------------------------- views
  const views = {
    welcome(d) {
      const people = (d.learners || []).filter((l) => l.role === "student");
      return `<div class="card enter">
        <h1 style="font-size:2.6rem">${esc(d.title)}.</h1>
        <p class="say" style="margin-top:.9rem">${people.length ? "Who's studying today?" : "Tell me your name, your class or year, and what you're into. I'll teach you your way."}</p>
        <div class="actions">${people.length ? people.map((p) => btn(p.name, `It's ${p.name}`)).join("") : btn("Set me up", "Set me up with the form", "primary")}</div>
      </div>`;
    },

    profile(d) {
      const l = d.learner;
      const mems = (d.memories || []).map((m) => `<li class="${m.source === "observed" ? "covered" : ""}"><span>${esc(m.text)}${m.source === "observed" ? ` <span class="muted">(noticed)</span>` : ""} ${btn("Forget", `Forget that ${m.text}`, "small")}</span></li>`).join("");
      const exams = (d.exams || []).map((e) => `<span class="chip learning">${esc(e.title)}: ${fmtDate(e.date)}</span>`).join("");
      return `<div class="card enter">
        <p class="sub">${d.isNew ? "Nice to meet you" : "What I know about you"}</p>
        <h1 style="margin:.2rem 0 1rem">${esc(l.name)}</h1>
        <div class="two">
          <div class="stack">
            <div><h2>I'll talk to you like</h2><p style="margin-top:.3rem">a ${esc(l.bandLabel)} learner <span class="muted">(${esc(l.level)})</span></p></div>
            ${l.interests.length ? `<div><h2>Examples from</h2><div class="chips" style="margin-top:.45rem">${l.interests.map((i) => `<span class="chip">${esc(i)}</span>`).join("")}</div></div>` : ""}
            ${exams ? `<div><h2>Coming up</h2><div class="chips" style="margin-top:.45rem">${exams}</div></div>` : ""}
          </div>
          <div>${mems ? `<h2 style="margin-bottom:.55rem">I remember</h2><ul class="kp">${mems}</ul>` : `<p class="sub">As we study, I'll remember what works for you. You can ask me to forget anything.</p>`}</div>
        </div>
        ${(d.lessons || []).length ? `<div style="margin-top:1.2rem">${learnedList(d.lessons)}</div>` : ""}
        ${d.isNew ? `<div class="actions">${btn("Study my notes", "I want to share my notes", "primary")}${btn("Pick a topic", "Teach me a new topic")}</div>` : ""}
      </div>`;
    },

    briefing(d) {
      return `<div class="card enter"><p class="sub">While you were away</p>
        <h1 style="margin:.2rem 0 .4rem">${esc(d.title)}</h1>
        ${briefingSlides(d)}
        <div class="actions">${btn("Start today's plan", "Let's start today's plan", "primary")}${btn("My study plan", "What's my study plan?")}</div></div>`;
    },

    research(d) {
      const slides = d.cards.map((c) => ({ html: `<h2>${esc(c.heading)}</h2><p>${esc(c.body)}</p>${c.example ? `<p class="ex"><b>For you:</b> ${esc(c.example)}</p>` : ""}` }));
      const src = (d.sources || []).map((x) => `<button type="button" data-link="${esc(x.url)}" title="${esc(x.url)}">${esc(x.domain.replace(/^www\./, ""))}</button>`).join("");
      return `<div class="card enter"><p class="sub">Beyond your notes, researched on the web</p>
        <h1 style="margin:.2rem 0 .6rem">${esc(d.title)}</h1>
        <p class="sub" style="max-width:52ch">${esc(d.overview)}</p>
        ${carousel(slides, d.title)}
        ${src ? `<div class="sources">Sources: ${src}</div>` : ""}
        <div class="actions">${btn("Quiz me on this", `Quiz me on ${d.topic}`, "primary")}${btn("Explain it differently", "Explain it differently")}</div></div>`;
    },

    lesson_learned(d) {
      return `<div class="card enter"><p class="sub">Learned from you</p>
        <h1 style="margin:.2rem 0 1rem">${esc(d.lesson && d.lesson.trim() ? d.lesson.replace(/^Call them (.+)$/, "I'll call you $1") : d.title)}</h1>
        ${learnedList(d.lessons)}</div>`;
    },

    recheck(d) {
      return `<div class="card enter"><p class="sub">${esc(d.concept ?? "Your last answer")}</p>
        <h1 style="margin:.2rem 0 .8rem">${d.overturned ? "You were right" : "Checked again"}</h1>
        <p class="say" style="font-size:1.1rem">${esc(d.speech)}</p>
        ${d.overturned && d.lesson ? `<p class="note event" style="margin-top:1rem">Next time: ${esc(d.lesson)}</p>` : ""}
        <div class="actions">${btn("Keep going", "Next question", "primary")}</div></div>`;
    },

    today(d) {
      const l = d.learner;
      const since = d.briefing && d.briefing.did.some((x) => x.kind !== "plan") ? `<div style="margin:.4rem 0 1rem"><h2>Since yesterday</h2>${briefingSlides({ did: d.briefing.did.filter((x) => x.kind !== "plan") })}</div>` : "";
      const tiles = [];
      if (d.exam) tiles.push(`<div class="tile"><span class="sub">${esc(d.exam.title)}</span><span class="big-num">${d.exam.daysLeft}</span><span>${d.exam.daysLeft === 1 ? "day to go" : "days to go"}, ${fmtDate(d.exam.date)}</span></div>`);
      if (d.weakSpot) tiles.push(`<div class="tile"><span class="sub">Start here</span><span style="font-size:1.3rem;font-weight:750">${esc(d.weakSpot.title)}</span>${d.weakSpot.note ? `<span class="note" style="margin-top:.3rem">${esc(cap(d.weakSpot.note))}</span>` : ""}</div>`);
      tiles.push(`<div class="tile"><span class="sub">Ready for review</span><span class="big-num" style="color:var(--hi-text)">${d.dueCount}</span><span>${d.newCount} new ${d.newCount === 1 ? "topic" : "topics"} waiting</span></div>`);
      if (l.streak?.current >= 1) tiles.push(`<div class="tile"><span class="sub">Streak</span><span class="big-num" style="color:var(--good)">${l.streak.current}</span><span>${l.streak.current === 1 ? "day" : "days in a row"}. Best: ${l.streak.best}</span></div>`);
      const actions = {
        add_material: btn("Study my notes", "I want to share my notes", "primary") + btn("Pick a topic", "Teach me a new topic"),
        review: btn("Start my review", "Quiz me", "primary") + btn("Explain my weak spot", `Explain ${d.weakSpot?.title ?? "my weak spot"}`),
        learn: btn("Explain the next topic", "Explain the next topic", "primary") + btn("Quiz me", "Quiz me"),
        teach_back: btn("Let me teach it back", "Let me teach it back to you", "primary") + btn("Quiz me", "Quiz me"),
      }[d.suggestion] ?? "";
      return `<div class="card enter"><p class="sub">${esc(d.date)}</p><h1 style="font-size:2.4rem;margin:.2rem 0 1.1rem">Hi, ${esc(l.name)}.</h1>
        ${since}<div class="tiles">${tiles.join("")}</div><div class="actions">${actions}${btn("My plan", "Show my study plan")}</div></div>`;
    },

    deck(d) {
      return `<div class="card enter">
        <div class="row" style="align-items:baseline"><h1 class="grow">${esc(d.deck.title)}</h1><span class="sub">${esc(d.deck.subject)}, ${d.concepts.length} topics</span></div>
        ${carousel(d.concepts.map((c, i) => ({ html: `<span class="sub" style="font-size:.8rem">Topic ${i + 1} of ${d.concepts.length}</span><h2>${esc(c.title)}</h2><p style="font-size:.95rem">${esc(c.summary ?? "")}</p><div class="actions">${btn("Explain", `Explain ${c.title}`, "small primary")}${btn("Quiz me", `Quiz me on ${c.title}`, "small")}</div>` })), `${d.deck.title} topics`)}
        <div class="actions">${btn("Research beyond my notes", `Research ${d.deck.title} beyond my notes`, "primary")}${btn("Quiz me", "Quiz me")}${btn("Flashcards", "Let's do flashcards")}</div>
      </div>`;
    },

    explanation(d) {
      const terms = termsOf(d.title);
      return `<div class="card enter">
        <div class="row" style="align-items:baseline;margin-bottom:1rem"><h1 class="grow">${esc(d.title)}</h1>${d.analogy ? `<span class="chip learning">${esc(d.analogy)}</span>` : ""}</div>
        <div class="two">
          <div class="stack">
            <p class="say">${highlight(d.explanation, terms)}</p>
            ${d.misconception ? `<p class="note">Last time: ${esc(d.misconception)}</p>` : ""}
          </div>
          <div class="index"><span class="label">Key points</span>${d.keyPoints.map((k) => `<div>${esc(k)}</div>`).join("")}</div>
        </div>
        ${d.checkQuestion ? `<p class="note hi" style="margin-top:1.2rem"><b>Quick check:</b> ${esc(d.checkQuestion)}</p>` : ""}
        <div class="actions">${btn("Got it, quiz me", `Quiz me on ${d.title}`, "primary")}${btn("Explain it differently", "Explain it differently")}${btn("Simpler please", "Explain it more simply")}${btn("Let me teach it back", `Let me teach ${d.title} back to you`)}</div>
      </div>`;
    },

    quiz_question(d) {
      const f = d.feedback;
      const dots = Array.from({ length: d.total }, (_, i) => `<i class="${d.results?.[i] ?? ""} ${i === d.number - 1 ? "now" : ""}"></i>`).join("");
      const fb = f ? `<div class="fb ${f.verdict}"><div><b>${f.verdict === "correct" ? "Correct" : f.verdict === "partial" ? "Almost" : "Not quite"}</b> ${esc(f.text.replace(/^(Not quite\.|Close!)\s*/, ""))}${f.misconception ? `<span class="tag">Noted: ${esc(f.misconception)}. I'll bring it back tomorrow.</span>` : ""}</div></div>` : "";
      let body;
      if (d.flashcard) {
        body = `<div class="flip ${d.flashcard.back ? "flipped" : ""}" data-flip title="Tap to flip"><div class="flip-inner">
          <div class="face index"><span class="label">${esc(d.concept.title)}</span><p>${esc(d.flashcard.front)}</p></div>
          <div class="face back index"><span class="label">Answer</span><p>${esc(d.flashcard.back ?? "Say your answer, or say flip.")}</p></div>
        </div></div>
        <div class="actions">${d.flashcard.back ? btn("I knew it", "Yes, I knew it", "primary") + btn("I didn't", "No, I didn't know it") : btn("Flip", "Flip", "primary") + btn("Hint", "Give me a hint") + btn("Skip", "Skip")}</div>`;
      } else {
        const q = d.question;
        const opts = q.type === "mcq" && q.options
          ? `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-say="${esc(o)}"><span>${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`
          : q.type === "truefalse"
            ? `<div class="actions" style="margin-top:0">${btn("True", "True", "primary")}${btn("False", "False")}</div>`
            : `<p class="sub">Say your answer out loud, in your own words.</p>`;
        body = `<p class="q">${esc(q.prompt.replace(/^True or false:\s*/i, ""))}</p>${q.type === "truefalse" ? `<p class="sub" style="margin:-0.5rem 0 1rem">True or false?</p>` : ""}${opts}
          <div class="actions">${btn("Hint", "Give me a hint")}${btn("Skip", "Skip")}${btn("Repeat", "Repeat the question")}</div>`;
      }
      return `<div class="card enter">${fb}
        <div class="row"><span class="sub grow">${esc(d.mode === "flashcards" ? "Flashcards" : d.title)}: ${esc(d.concept.title)}</span><div class="dots" aria-label="Question ${d.number} of ${d.total}">${dots}</div></div>
        ${d.hint ? `<p class="note hi" style="margin-top:.9rem">Hint: ${esc(d.hint)}</p>` : ""}
        ${body}</div>`;
    },

    group_question(d) {
      const f = d.feedback;
      const q = d.question;
      const board = d.players.map((p) => `<div class="player ${p.current ? "now" : ""}"><span class="pname">${esc(p.name)}${p.guest ? ` <span class="muted">(guest)</span>` : ""}</span><span class="pscore">${p.score}</span>${p.streak >= 2 ? `<span class="chip learning">${p.streak} in a row</span>` : ""}</div>`).join("");
      const opts = q.type === "mcq" && q.options
        ? `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-say="${esc(o)}"><span>${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`
        : q.type === "truefalse"
          ? `<div class="actions" style="margin-top:0">${btn("True", "True", "primary")}${btn("False", "False")}</div>`
          : `<p class="sub">${esc(d.currentPlayer)}, say your answer out loud.</p>`;
      return `<div class="card enter">
        <div class="board">${board}</div>
        ${f ? `<div class="fb ${f.verdict}" style="margin-top:1rem"><div><b>${esc(f.player)}: ${f.points ? `+${f.points}` : "0"}</b> ${esc(f.text)}</div></div>` : ""}
        <div class="row" style="margin-top:1rem"><span class="sub grow">${esc(d.title)}: question ${d.turn} of ${d.totalTurns}</span><span class="chip learning">${esc(d.currentPlayer)}'s turn</span></div>
        ${d.hint ? `<p class="note hi" style="margin-top:.8rem">Hint: ${esc(d.hint)}</p>` : ""}
        <p class="q">${esc(q.prompt.replace(/^True or false:\s*/i, ""))}</p>${q.type === "truefalse" ? `<p class="sub" style="margin:-0.5rem 0 1rem">True or false?</p>` : ""}${opts}
        <div class="actions">${btn("Hint", "Give me a hint")}${btn("Skip", "Skip")}${btn("Scores", "What are the scores?")}</div>
      </div>`;
    },

    online_game(d) {
      const tag = (p) => `<span class="homechip">${p.home === "here" ? "Here" : "At their home"}</span>`;
      const board = `<div class="board">${d.players.map((p) => `<div class="player ${p.current ? "now" : ""}"><span class="pname">${esc(p.name)}</span><span class="pscore">${d.status === "lobby" ? "" : p.score}</span>${p.streak >= 2 && d.status === "playing" ? `<span class="chip learning">${p.streak} in a row</span>` : ""}${p.winner ? `<span class="chip solid">Winner</span>` : ""}${tag(p)}</div>`).join("")}</div>`;
      const event = d.lastEvent ? `<p class="note event" style="margin-top:.9rem">${esc(d.lastEvent)}</p>` : "";
      if (d.status === "lobby") {
        return `<div class="card enter"><p class="sub">Study Together online · invite only</p>
          <div class="gamecode">${esc(d.code)}</div>
          <p class="sub" style="margin-bottom:1rem">${d.isHost ? `Friends say “join game ${esc(d.spokenCode)}” on their own device.` : `Waiting for the host to start.`}</p>
          ${board}${event}
          <div class="actions">${d.isHost ? btn("Start the game", "Start the game", d.players.length > 1 ? "primary" : "") : ""}${btn("Leave", "Leave the game")}</div></div>`;
      }
      if (d.status === "done") {
        return `<div class="card enter"><p class="sub">${d.title === "Study Together online" ? "Game over" : "Study Together online"}</p><h1 style="margin:.2rem 0 .8rem">${esc(d.title)}</h1>
          ${board}${event}
          <div class="actions">${d.isHost ? btn("Play again", "Start an online game", "primary") : ""}${btn("Done for now", "I'm done for today")}</div></div>`;
      }
      const q = d.question;
      const answer = !d.yourTurn ? "" : q.type === "mcq" && q.options
        ? `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-say="${esc(o)}"><span>${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`
        : q.type === "truefalse"
          ? `<div class="actions" style="margin-top:0">${btn("True", "True", "primary")}${btn("False", "False")}</div>`
          : `<p class="sub">Say your answer out loud.</p>`;
      return `<div class="card enter">
        ${board}${event}
        <div class="row" style="margin-top:1rem"><span class="sub grow">${esc(d.title)}: question ${d.turn} of ${d.totalTurns}</span><span class="chip ${d.yourTurn ? "solid" : "learning"}">${d.yourTurn ? "Your turn" : `${esc(d.currentPlayer)}'s turn`}</span></div>
        ${d.hint ? `<p class="note hi" style="margin-top:.8rem">Hint: ${esc(d.hint)}</p>` : ""}
        ${d.yourTurn ? `<p class="q">${esc(q.prompt.replace(/^True or false:\s*/i, ""))}</p>${q.type === "truefalse" ? `<p class="sub" style="margin:-0.5rem 0 1rem">True or false?</p>` : ""}${answer}` : `<p class="q muted">Waiting for ${esc(d.currentPlayer)} to answer at their home…</p>`}
        <div class="actions">${d.yourTurn ? btn("Hint", "Give me a hint") + btn("Skip", "Skip") : ""}${btn("Scores", "What are the scores?")}${btn(d.isHost ? "End game" : "Leave", d.isHost ? "End the game" : "Leave the game")}</div>
      </div>`;
    },

    group_summary(d) {
      const rows = d.players.map((p, i) => `<li class="${p.winner ? "today" : ""}"><span class="when">${p.winner ? "Winner" : `#${i + 1}`}</span><span>${esc(p.name)}${p.guest ? ` <span class="muted">(guest)</span>` : ""} <span class="sub">${p.correct} of ${p.answered} right${p.bestStreak >= 2 ? `, best streak ${p.bestStreak}` : ""}</span></span><span class="pscore">${p.score}</span></li>`).join("");
      return `<div class="card enter"><p class="sub">Study Together</p><h1 style="margin:.2rem 0 .8rem">${esc(d.title)}</h1>
        <ul class="days">${rows}</ul>
        <div class="actions">${btn("Rematch", "Rematch!", "primary")}${btn("Done for now", "I'm done for today")}</div></div>`;
    },

    quiz_summary(d) {
      const f = d.feedback;
      const ratio = d.total ? d.correct / d.total : 0;
      const map = (d.mastery || []).map((m) => `<div class="cell ${m.status}"><span style="font-weight:650">${esc(m.title)}</span><div class="meter"><i style="width:${Math.round(m.strength * 100)}%"></i></div>${chip(m.status)}</div>`).join("");
      return `<div class="card enter">
        ${f ? `<div class="fb ${f.verdict}"><div><b>${f.verdict === "correct" ? "Correct" : f.verdict === "partial" ? "Almost" : "Not quite"}</b> ${esc(f.text.replace(/^(Not quite\.|Close!)\s*/, ""))}</div></div>` : ""}
        <div class="row" style="align-items:flex-end;gap:1.4rem">
          <div><span class="big-num" style="color:${ratio >= 0.7 ? "var(--good)" : ratio >= 0.4 ? "var(--hi-text)" : "var(--oops)"}">${d.correct}/${d.total}</span></div>
          <div class="grow"><h1>${ratio === 1 ? "Perfect round" : ratio >= 0.7 ? "Strong round" : "Round done"}</h1>${d.weak.length ? `<p class="sub" style="margin-top:.3rem">Next time: ${esc(d.weak.map((w) => w.title).join(", "))}</p>` : ""}</div>
          ${d.streak?.current ? `<div style="text-align:right"><span class="sub">Streak</span><div class="big-num" style="font-size:2.6rem;color:var(--good)">${d.streak.current}</div></div>` : ""}
        </div>
        ${map ? `<h2 style="margin:1.3rem 0 .6rem">Your mastery map</h2><div class="map">${map}</div>` : ""}
        <div class="actions">${d.weak.length ? btn("Explain my weak spot", `Explain ${d.weak[0].title}`, "primary") : ""}${btn("Another round", "Quiz me again", d.weak.length ? "" : "primary")}${btn("My plan", "Show my study plan")}</div>
      </div>`;
    },

    teach_back(d) {
      if (d.phase === "listening") {
        return `<div class="card enter">
          <p class="sub">Your turn to teach</p><h1 style="margin:.2rem 0 1rem">${esc(d.title.replace(/^Teach me: /, ""))}</h1>
          <p class="say">Explain it out loud, in your own words. I'm listening for ${d.checklist.length} key ideas.</p>
          <div class="dots" style="margin-top:1rem">${d.checklist.map(() => "<i></i>").join("")}</div>
        </div>`;
      }
      const pct = Math.round(d.score * 100);
      return `<div class="card enter">
        <div class="row" style="align-items:flex-end;gap:1.4rem;margin-bottom:1.1rem">
          <span class="big-num" style="color:${d.score >= 0.8 ? "var(--good)" : d.score >= 0.4 ? "var(--hi-text)" : "var(--oops)"}">${pct}%</span>
          <div class="grow"><p class="sub">You taught</p><h1>${esc(d.title.replace(/^You taught: /, ""))}</h1></div>
        </div>
        <ul class="kp">${d.checklist.map((c) => `<li class="${c.status}">${c.status === "covered" ? `<span><mark class="good">${esc(c.point)}</mark></span>` : `<span>${esc(c.point)}</span>`}</li>`).join("")}</ul>
        ${(d.incorrect || []).length ? `<p class="note" style="margin-top:1rem">Careful: ${esc(d.incorrect.join("; "))}</p>` : ""}
        <div class="actions">${d.score < 0.8 ? btn("Try again", "Let me try teaching it again", "primary") + btn("Explain what I missed", "Explain the part I missed") : btn("Quiz me", "Quiz me", "primary")}</div>
      </div>`;
    },

    study_plan(d) {
      const map = d.mastery.map((m) => `<div class="cell ${m.status}"><span style="font-weight:650">${esc(m.title)}</span><div class="meter"><i style="width:${Math.max(4, Math.round(m.strength * 100))}%"></i></div><div class="row" style="gap:.4rem">${chip(m.status)}</div>${m.misconception ? `<span class="sub" style="font-size:.78rem">${esc(cap(m.misconception))}</span>` : ""}</div>`).join("");
      const days = d.days.map((x) => `<li class="${x.label === "Today" ? "today" : ""}"><span class="when">${esc(cap(x.label))}</span><span>${esc(x.focus.join(", "))}</span><span class="sub">${x.minutes} min</span></li>`).join("");
      return `<div class="card enter">
        <div class="row" style="align-items:flex-end;gap:1.4rem;margin-bottom:1.2rem">
          ${d.exam ? `<div><span class="big-num">${d.exam.daysLeft}</span></div>` : ""}
          <div class="grow">${d.exam ? `<p class="sub">${d.exam.daysLeft === 1 ? "day" : "days"} until</p>` : ""}<h1>${esc(d.exam ? d.exam.title : d.title)}</h1></div>
        </div>
        <div class="map">${map}</div>
        <h2 style="margin:1.3rem 0 .3rem">The plan</h2><ul class="days">${days}</ul>
        <div class="actions">${btn("Start today's session", "Quiz me", "primary")}${btn("One-page summary", "Give me a summary")}</div>
      </div>`;
    },

    summary(d) {
      return `<div class="card enter">
        <h1 style="margin-bottom:1rem">${esc(d.title)}</h1>
        <div class="index"><span class="label">${esc(d.headline)}</span>${d.points.map((p) => {
          const i = p.indexOf(":");
          return i > 0 && i < 48 ? `<div><mark>${esc(p.slice(0, i))}</mark>${esc(p.slice(i))}</div>` : `<div>${esc(p)}</div>`;
        }).join("")}${d.memoryTrick ? `<div style="margin-top:1.6rem"><b>Memory trick:</b> ${esc(d.memoryTrick)}</div>` : ""}</div>
        <div class="actions">${btn("Quiz me", "Quiz me", "primary")}${btn("Flashcards", "Let's do flashcards")}</div>
      </div>`;
    },

    focus(d) {
      const s = d.session;
      if (d.phase === "done") {
        return `<div class="card enter"><p class="sub">Focus session done</p><h1 style="font-size:2.4rem;margin:.2rem 0 .8rem">${d.minutes} minutes of real focus.</h1>
          ${d.streak?.current ? `<p class="say">Day ${d.streak.current} of your streak.</p>` : ""}
          <div class="actions">${btn("Quick quiz", "Quiz me on what I just studied", "primary")}${btn("I'm done for today", "I'm done for today")}</div></div>`;
      }
      const end = Date.parse(s.endsAt);
      const total = s.minutes * 60;
      const html = `<div class="card enter"><p class="sub">Focus mode${s.topic ? `: ${esc(s.topic)}` : ""}. Phone face down.</p>
        <p class="timer" id="timer" style="margin-top:.6rem">${String(s.minutes).padStart(2, "0")}:00</p>
        <div class="ring"><i id="ring" style="width:0%"></i></div>
        <div class="actions">${btn("I'm done", "End my focus session")}</div></div>`;
      setTimeout(() => {
        // The view keeps time itself, and tells the conversation when the session is over.
        // Server clock can differ from this device (the demo clock skips days), so measure from its "now".
        const skew = Date.now() - Date.parse(d.serverNow ?? new Date().toISOString());
        const tick = () => {
          const left = Math.max(0, Math.round((end - (Date.now() - skew)) / 1000));
          const t = document.getElementById("timer");
          const r = document.getElementById("ring");
          if (!t) return stopTimers();
          t.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
          r.style.width = `${Math.min(100, ((total - left) / total) * 100)}%`;
          if (left === 0) {
            stopTimers();
            say("My focus session is done");
          }
        };
        tick();
        timers.push(setInterval(tick, 1000));
      });
      return html;
    },

    story(d) {
      document.body.classList.add("story");
      const pages = d.pages;
      window.__pages = pages;
      window.__page = 0;
      return `<div class="storybook enter" style="position:relative">
        <div class="moon" aria-hidden="true"></div>
        <h1>${esc(d.title)}</h1>
        ${d.voiceLabel ? `<p class="voice-badge">${esc(d.voiceLabel)}</p>` : ""}
        <p class="for">For ${esc(d.child.name)}. The lesson: ${esc(d.lesson.replace(/^(why|how|that)\s+/i, "").replace(/\.$/, ""))}.</p>
        <p class="page" id="page">${esc(pages[0])}</p>
        <div class="pager"><button class="small" data-page="-1" aria-label="Previous page">Back</button>${pages.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}<button class="small" data-page="1" aria-label="Next page">Next</button></div>
        ${d.question ? `<p class="for" style="margin-top:1.1rem;font-size:1rem;color:#e7dcc4">Ask ${esc(d.child.name)}: ${esc(d.question)}</p>` : ""}
        <div class="actions">${btn("Another story", `Tell ${d.child.name} another story`)}${btn("Goodnight", "Goodnight", "primary")}</div>
      </div>`;
    },

    meet(d) {
      const l = d.learner;
      return `<div class="card enter">
        <p class="sub">Nice to meet you</p>
        <h1 style="font-size:2.8rem;margin:.2rem 0 1rem">${esc(d.title)}</h1>
        ${d.known.length ? `<div class="index" style="max-width:34rem"><span class="label">What your ${esc(d.addedBy.relation.toLowerCase())} told me</span>${d.known.map((k) => `<div>${esc(cap(k.replace(/^you're in /, "in ").replace(/^you're (\d+)$/, "$1 years old").replace(/^you love /, "loves ")))}</div>`).join("")}</div>` : ""}
        <p class="say" style="margin-top:1.2rem"><mark>${esc(d.question)}</mark></p>
      </div>`;
    },

    parent_saved(d) {
      const c = d.child;
      return `<div class="card enter">
        <p class="sub">${d.parent ? `Parent: ${esc(d.parent.name)} (${esc(d.parent.relation)})` : "Parent note"}</p>
        <h1 style="margin:.2rem 0 1rem">${esc(d.title)}</h1>
        <div class="two">
          <div class="stack">
            <div><h2>I'll talk to ${esc(c.name)} like</h2><p style="margin-top:.3rem">a ${esc(c.bandLabel)} learner <span class="muted">(${esc(c.level)})</span></p></div>
            ${c.interests.length ? `<div><h2>Examples from</h2><div class="chips" style="margin-top:.45rem">${c.interests.map((i) => `<span class="chip">${esc(i)}</span>`).join("")}</div></div>` : ""}
          </div>
          <div>${d.notes.length ? `<h2 style="margin-bottom:.55rem">Keeping in mind</h2><ul class="kp">${d.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : `<p class="sub">Add anything I should keep in mind, any time.</p>`}</div>
        </div>
        <div class="actions">${btn(`How is ${c.name} doing?`, `How is ${c.name} doing?`)}</div>
      </div>`;
    },

    parent_overview(d) {
      const c = d.child;
      const CAT = { self_harm: "Safety", abuse: "Safety", danger: "Safety", bullying: "Bullying", distress: "Feeling low" };
      const alerts = (d.concerns || []).map((x) => `<div class="alert ${x.severity}"><div><b>${esc(CAT[x.category] ?? "Concern")}${x.isNew ? " (new)" : ""}</b><span class="sub" style="margin-left:.5rem">${esc(x.when)}</span></div><div>${esc(x.summary)}.</div>${x.excerpt ? `<div class="quote">“${esc(x.excerpt)}”</div>` : ""}</div>`).join("");
      const map = (d.mastery || []).map((m) => `<div class="cell ${m.status}"><span style="font-weight:650">${esc(m.title)}</span><div class="meter"><i style="width:${Math.max(4, Math.round(m.strength * 100))}%"></i></div>${chip(m.status)}</div>`).join("");
      const recent = (d.recent || []).map((t) => `<li><span class="when">${esc(cap(t.when))}</span><span><b>${esc(c.name)}:</b> ${esc(t.heard)}<br><span class="sub">Vidya: ${esc(t.said.slice(0, 160))}${t.said.length > 160 ? "…" : ""}</span></span><span></span></li>`).join("");
      const vis = { full: "Full history", summary: "Summary", private: "Private (adult)" }[d.visibility];
      return `<div class="card enter">
        <div class="row" style="align-items:baseline"><div class="grow"><p class="sub">Parent view</p><h1 style="margin:.2rem 0 .3rem">${esc(d.title)}</h1></div><span class="chip ${d.visibility === "full" ? "solid" : d.visibility === "summary" ? "learning" : "new"}">${esc(vis)}</span></div>
        ${alerts ? `<div class="stack" style="margin:.8rem 0 1rem">${alerts}</div>` : ""}
        <div class="tiles" style="margin-top:.8rem">
          <div class="tile"><span class="sub">Minutes studied</span><span class="big-num">${d.minutes}</span></div>
          <div class="tile"><span class="sub">Streak</span><span class="big-num" style="color:var(--good)">${d.streak.current}</span><span>Best ${d.streak.best}</span></div>
          <div class="tile"><span class="sub">This week</span><span class="big-num" style="color:var(--hi-text)">${d.accuracy === null ? "–" : `${d.accuracy}%`}</span><span>answers right</span></div>
          <div class="tile"><span class="sub">Conversations</span><span class="big-num">${d.conversations}</span><span>this week</span></div>
        </div>
        ${d.school ? `<p class="note ${d.school.missing ? "" : "hi"}" style="margin-top:1rem">From school: ${d.school.dueSoon} due in the next few days${d.school.missing ? `, ${d.school.missing} past due` : ""}.</p>` : ""}
        ${map ? `<h2 style="margin:1.2rem 0 .6rem">Topics</h2><div class="map">${map}</div>` : ""}
        ${d.summary ? `<h2 style="margin:1.2rem 0 .5rem">This week, in summary</h2><div class="chips">${d.summary.topics.map((x) => `<span class="chip">${esc(x)}</span>`).join("") || `<span class="sub">No study topics yet.</span>`}</div>${d.summary.moods.length ? `<p class="sub" style="margin-top:.5rem">Said about how they feel: ${esc(d.summary.moods.join("; "))}</p>` : ""}` : ""}
        ${recent ? `<h2 style="margin:1.2rem 0 .3rem">Latest conversations</h2><ul class="days">${recent}</ul>` : ""}
        ${(d.sharedWithMe || []).length ? `<p class="note hi" style="margin-top:1rem">${esc(c.name)} told me: ${esc(d.sharedWithMe.slice(-3).join("; "))}</p>` : ""}
        <p class="sub" style="margin-top:1rem">${esc(d.transparencyNote)}</p>
        <div class="actions">${d.visibility === "full" ? btn("See all conversations", `Show me ${c.name}'s conversations`) : d.visibility === "summary" ? btn("Switch to full history", `Turn on full history for ${c.name}`) : ""}</div>
      </div>`;
    },

    parent_history(d) {
      const rows = d.turns.map((t) => `<li class="${t.flagged ? "flag" : ""}"><span class="when">${esc(cap(t.when))}</span><span><b>${esc(d.child.name)}:</b> ${esc(t.heard)}<br><span class="sub">Vidya: ${esc(t.said.slice(0, 220))}${t.said.length > 220 ? "…" : ""}</span></span><span>${t.flagged ? `<span class="chip shaky">Flagged</span>` : ""}</span></li>`).join("");
      return `<div class="card enter"><p class="sub">Parent view, last ${d.days} days</p><h1 style="margin:.2rem 0 .8rem">${esc(d.title)}</h1>
        ${rows ? `<ul class="days">${rows}</ul>` : `<p class="say">No conversations yet.</p>`}
        <div class="actions">${btn("Delete this history", `Delete ${d.child.name}'s conversation history`)}</div></div>`;
    },

    parent_settings(d) {
      return `<div class="card enter"><p class="sub">Parent settings</p><h1 style="margin:.2rem 0 .6rem">${esc(d.title)}</h1>
        <p class="say">${d.visibility === "full" ? "Full history: you see every conversation." : d.visibility === "summary" ? "Summary: you see topics, progress and mood." : "Private."}</p>
        <p class="sub" style="margin-top:.6rem">Safety concerns always come to you, whatever this is set to. ${esc(d.child.name)} is told about any change.</p></div>`;
    },

    concern_flagged(d) {
      document.body.classList.add("story");
      return `<div class="storybook enter" style="position:relative">
        <h1>${esc(d.title)}</h1>
        <p class="page" style="min-height:0">${esc(d.speech)}</p>
        ${d.guardian ? `<p class="voice-badge">Letting your ${esc(d.guardian.toLowerCase())} know</p>` : ""}
      </div>`;
    },

    school_connect(d) {
      return `<div class="card enter"><p class="sub">School</p><h1 style="margin:.2rem 0 .8rem">${esc(d.title)}</h1>
        <p class="say">Read-only: classes, assignments, due dates, tests and teacher notes. Nothing is ever submitted.</p>
        ${d.live ? "" : `<p class="sub" style="margin-top:.6rem">Test mode: connects a sample class.</p>`}
        <div class="actions"><button class="primary" data-link="${esc(d.url)}">Open the connect page</button></div></div>`;
    },

    school_synced(d) {
      return `<div class="card enter"><p class="sub">School synced${d.live ? "" : " (sample class)"}</p><h1 style="margin:.2rem 0 1rem">${esc(d.learner.name)}'s classes</h1>
        <div class="tiles">${d.courses.map((c) => `<div class="tile"><span style="font-size:1.15rem;font-weight:750">${esc(c.name)}</span><span class="sub">${esc([c.teacher, c.section].filter(Boolean).join(", "))}</span></div>`).join("")}</div>
        ${d.newExams.length ? `<p class="note hi" style="margin-top:1rem">Added to your study plan: ${esc(d.newExams.join("; "))}</p>` : ""}
        ${d.studySets.length ? `<p class="note hi" style="margin-top:.6rem">Teacher notes turned into a study set: ${esc(d.studySets.join("; "))}</p>` : ""}
        <div class="actions">${btn("What's due?", "What homework do I have?", "primary")}${btn("Study for the test", "Quiz me")}</div></div>`;
    },

    school_homework(d) {
      const LABEL = { missing: "Past due", todo: "To do", done: "Turned in" };
      const rows = d.items.map((i) => `<li class="${i.state === "missing" ? "flag" : ""}"><span class="when">${esc(i.when ? cap(i.when) : "")}</span><span><b>${esc(i.title)}</b>${i.kind === "test" ? ` <span class="chip learning">Test</span>` : ""}<br><span class="sub">${esc(i.course)}${i.teacher ? `, ${esc(i.teacher)}` : ""}</span></span><span class="chip ${i.state === "done" ? "solid" : i.state === "missing" ? "shaky" : "new"}">${LABEL[i.state]}</span></li>`).join("");
      return `<div class="card enter"><p class="sub">From school</p><h1 style="margin:.2rem 0 .8rem">${esc(d.title)}</h1>
        ${rows ? `<ul class="days">${rows}</ul>` : `<p class="say">${esc(d.speech)}</p>`}
        ${d.items.some((i) => i.kind === "test") ? `<div class="actions">${btn("Study for the test", "Quiz me", "primary")}${btn("My plan", "Show my study plan")}</div>` : ""}</div>`;
    },

    school_disconnected(d) { return `<div class="card enter"><h1>${esc(d.title)}</h1><p class="sub" style="margin-top:.4rem">${esc(d.speech)}</p></div>`; },

    voice_enroll(d) {
      document.body.classList.add("story");
      return `<div class="storybook enter" style="position:relative">
        <div class="moon" aria-hidden="true"></div>
        <h1>${esc(d.title)}</h1>
        <p class="for">So bedtime stories can be read in ${esc(d.parentName)}'s voice. About one minute.</p>
        <ol class="steps">${d.steps.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
        <p class="for" style="margin-top:1rem">The voice only reads stories and goodnight messages you write. It never chats as you, and you can delete it any time.</p>
        ${d.live ? "" : `<p class="for" style="color:#e7dcc4">Test mode: no real voice is created until the voice service key is added.</p>`}
        <div class="actions"><button class="primary" data-link="${esc(d.url)}">Open the recording page</button></div>
      </div>`;
    },

    parent_voices(d) {
      const rows = d.voices.map((v) => `<li><span class="when">${esc(v.relation)}</span><span>${esc(v.parentName)}${v.children.length ? `, reads to ${esc(v.children.join(", "))}` : ""}</span><span class="chip ${v.status === "active" ? "solid" : "new"}">${v.status === "active" ? "On" : "Paused"}</span></li>`).join("");
      return `<div class="card enter"><h1>${esc(d.title)}</h1>
        <p class="sub" style="margin:.3rem 0 1rem">They only read bedtime stories and goodnight messages written by a parent.${d.live ? "" : " Test mode: no real cloned audio yet."}</p>
        ${rows ? `<ul class="days">${rows}</ul>` : `<p class="say">No story voices yet.</p>`}
        <div class="actions">${btn("Add a voice", "I want to record my voice for bedtime stories", rows ? "" : "primary")}${d.voices[0] ? btn(`Delete ${d.voices[0].relation}'s voice`, `Delete ${d.voices[0].relation}'s story voice`) : ""}</div></div>`;
    },

    parent_voices_changed(d) { return `<div class="card enter"><h1>${esc(d.title)}</h1><p class="sub" style="margin-top:.4rem">${esc(d.speech)}</p></div>`; },

    voice_message_saved(d) {
      document.body.classList.add("story");
      return `<div class="storybook enter" style="position:relative"><div class="moon" aria-hidden="true"></div>
        <h1>${esc(d.title)}</h1><p class="voice-badge">Will play in ${esc(d.from)}'s voice (AI)</p>
        <p class="msg">“${esc(d.text)}”</p></div>`;
    },

    voice_messages(d) {
      document.body.classList.add("story");
      if (!d.messages.length) return `<div class="storybook enter"><h1>${esc(d.title)}</h1><p class="msg">${esc(d.speech)}</p></div>`;
      return `<div class="storybook enter" style="position:relative"><div class="moon" aria-hidden="true"></div>
        <h1>${esc(d.title)}</h1>
        ${d.messages.map((m) => `<p class="voice-badge">${esc(m.label)}</p><p class="msg">“${esc(m.text)}”</p>`).join("")}</div>`;
    },

    cancelled(d) { return `<div class="card"><h1>${esc(d.title)}</h1><p class="sub" style="margin-top:.4rem">${esc(d.speech)}</p></div>`; },
    school_needs_parent(d) {
      return `<div class="card enter"><p class="sub">School not connected</p><h1 style="margin:.2rem 0 .8rem">A parent needs to connect this</h1>
        <p class="say" style="font-size:1.1rem">${esc(d.speech)}</p></div>`;
    },
    forgotten(d) { return `<div class="card"><h1>${esc(d.title)}</h1><p class="sub" style="margin-top:.4rem">${esc(d.speech)}</p>${d.lessons ? learnedList(d.lessons) : ""}</div>`; },
    study_sets_deleted(d) {
      const left = (d.remaining ?? []).map((x) => `<li><b>${esc(x.title)}</b> <span class="sub">${x.topics} ${x.topics === 1 ? "topic" : "topics"}</span></li>`).join("");
      return `<div class="card enter"><p class="sub">Deleted ${esc((d.deleted ?? []).join(", "))}</p>
        <h1 style="margin:.2rem 0 .8rem">${d.remaining?.length ? "Your study sets now" : "No study sets yet"}</h1>
        ${left ? `<ul class="kp">${left}</ul>` : `<p class="sub">Your profile and what I've learned about you are still here.</p>`}
        <div class="actions">${d.remaining?.length ? btn("My plan", "Show my study plan", "primary") : btn("Learn a topic", "Teach me something new", "primary")}</div></div>`;
    },
    memory_saved(d) { return `<div class="card"><p class="sub">I'll remember</p><h1 style="margin-top:.3rem">${esc(d.memory?.text ?? "")}</h1></div>`; },
    error(d) { return `<div class="card"><p class="say">${esc(d.speech)}</p></div>`; },
  };

  function turnPage(delta) {
    const pages = window.__pages || [];
    window.__page = Math.max(0, Math.min(pages.length - 1, (window.__page || 0) + delta));
    const el = document.getElementById("page");
    if (el) el.textContent = pages[window.__page];
    document.querySelectorAll(".pager i").forEach((dot, i) => dot.classList.toggle("on", i === window.__page));
  }

  function render(data) {
    stopTimers();
    document.body.classList.remove("story");
    const view = views[data?.kind];
    try {
      root.innerHTML = view ? view(data) : `<div class="card"><p class="say">${esc(data?.speech ?? "")}</p></div>`;
      initCarousels();
    } catch (err) {
      console.error(err);
      root.innerHTML = `<div class="card"><p class="say">${esc(data?.speech ?? "")}</p></div>`;
    }
  }

  // Standalone preview: card.html#<base64 of the JSON result>
  if (location.hash.length > 1) {
    try { render(JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))))); } catch {}
  }
})();
</script>
</body>
</html>
